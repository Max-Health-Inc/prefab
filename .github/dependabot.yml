# Dependabot configuration for automatic dependency updates.
#
# Adapted from the sibling config in Max-Health-Inc/mcp-http, with this repo's
# branch names.
#
# IMPORTANT — target-branch: "dev"
# Merging to `main` publishes to npm: release.yml runs on `push: branches: [main]`,
# cuts the version and tags it, and publish.yml fires on the tag. A Dependabot PR
# landing on `main` would therefore cut a release for a routine bump. These PRs must
# land on `dev` and ship through the standing promotion PR that auto-pr.yml keeps
# open. Note the branch here is `dev`, not the `develop` used by some sibling repos.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # One PR per week for all action bumps rather than one per action.
      actions:
        patterns:
          - "*"

  # npm
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      # The package ships zero runtime dependencies, so everything here is a
      # devDependency; grouping keeps this to one PR a week.
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # typescript-eslint 8.65.0 declares `peer typescript: >=4.8.4 <6.1.0`
      # (verified against the installed tree, which is on typescript 6.0.3). A TS 7
      # bump lands outside that range and breaks `bun run lint`, and a grouped PR
      # would then fail every week and block the other dev-dependency updates.
      #
      # The cap is <6.1.0, so a *minor* bump to 6.1 is also outside the supported
      # range and will start emitting typescript-eslint's unsupported-version
      # warning. Only the major is ignored here, because that is the case actually
      # verified to fail; if 6.1 turns out to break lint too, widen this to
      # `version-update:semver-minor`.
      #
      # Drop this entry once typescript-eslint supports the 7.x line.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
