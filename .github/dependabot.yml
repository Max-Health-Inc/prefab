# Dependabot configuration — GitHub Actions ONLY.
#
# Deliberately not the npm ecosystem. DRY.codes already reports dependency drift across every
# indexed repo at once (`list_dependency_drift`), which is the more useful view: it shows a
# library pinned at N different versions org-wide rather than nudging one repo at a time with
# no sight of its siblings.
#
# Actions are kept because nothing else watches them: pinned per workflow file, invisible to a
# package index, and a stale action is a supply-chain question rather than a drift one.
#
# NOTE: Dependabot reads this file from the DEFAULT branch, so a change here takes effect once
# `dev` is promoted to main, not on the push to dev.
#
# IMPORTANT — target-branch: "dev"
# Merging to `main` publishes to npm: release.yml runs on `push: branches: [main]`,
# cuts the version and tags it, and publish.yml fires on the tag. A Dependabot PR
# landing on `main` would therefore cut a release for a routine bump. These PRs must
# land on `dev` and ship through the standing promotion PR that auto-pr.yml keeps
# open. Note the branch here is `dev`, not the `develop` used by some sibling repos.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # One PR per week for all action bumps rather than one per action.
      actions:
        patterns:
          - "*"
