name: Auto PR (dev → main)

# Merging the standing PR publishes to npm through release.yml.
on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    uses: max-network/.github/.github/workflows/auto-pr.yml@main
    with:
      head-branch: dev
      title: "🚀 Promote dev → main (@maxhealth.tech/prefab)"
      body: |
        **Automated PR** — merging `dev` into `main`.

        Merging **publishes to npm**: release.yml stamps the changelog, tags, and publishes.
    secrets: inherit
