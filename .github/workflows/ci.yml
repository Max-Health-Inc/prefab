name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  test:
    uses: max-network/.github/.github/workflows/check.yml@main
    with:
      runtime: bun
      steps: "typecheck lint test check:docs build verify:dist"

  changelog:
    uses: max-network/.github/.github/workflows/changelog-guard.yml@main
