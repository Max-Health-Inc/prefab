name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Doc examples typecheck
        run: bun run check:docs

      # A release merge can file unreleased entries under the version that just
      # shipped, and it does so without conflicting. This is what notices.
      - name: Changelog integrity
        run: |
          git fetch --depth=1 origin main
          bun run check:changelog origin/main

      - name: Build
        run: bun run build

      - name: Verify bundle exists
        run: test -f dist/renderer.min.js
