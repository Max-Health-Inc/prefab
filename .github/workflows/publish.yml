name: Publish

# Dispatched by release.yml at the tag it pushed, after its gate passed on that commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    uses: max-network/.github/.github/workflows/publish-package.yml@main
    with:
      runtime: bun
      scope: '@maxhealth.tech'
      registry: https://registry.npmjs.org
      check-steps: "typecheck lint build"
