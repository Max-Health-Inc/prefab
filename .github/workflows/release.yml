name: Release & Publish

# Merging to `main` publishes to npm. A merge with nothing under `## [Unreleased]` skips;
# a manual dispatch with an empty changelog fails.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  release:
    uses: max-network/.github/.github/workflows/changelog-release.yml@main
    with:
      staging-branch: dev
      sync-version: sed -i "s/export const VERSION = '[^']*'/export const VERSION = '${NEXT}'/" src/core/version.ts
      version-files: src/core/version.ts
      checks: |
        bun run lint
        bun run typecheck
        bun test
      pre-release: cd skills && zip -r ../prefab-ui-skill.zip prefab-ui/
      release-files: |
        dist/renderer.min.js
        dist/renderer.auto.min.js
        dist/a2ui.min.js
        dist/prefab.css
        prefab-ui-skill.zip
    secrets: inherit
